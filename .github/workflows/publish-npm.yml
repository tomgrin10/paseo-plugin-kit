# Reusable publish workflow for Tom's Paseo plugins. A plugin calls it from its own
# .github/workflows/publish-npm.yml, so npm trusted publishing still sees that caller file:
#
#   on:
#     push: { tags: ["v*"] }
#     workflow_dispatch: { inputs: { tag: { description: Existing release tag to retry, required: true, type: string } } }
#   permissions: { contents: write, id-token: write, pull-requests: read }
#   jobs:
#     publish:
#       uses: tomgrin10/paseo-plugin-kit/.github/workflows/publish-npm.yml@v0.1.0
#       with: { tag: "${{ inputs.tag || github.ref_name }}" }
#
# The plugin needs paseo-plugin-kit as a devDependency (the paseo-kit bin) and an `npm run verify` script.
# A prerelease always publishes to npm's `beta` dist-tag and is verified never to be `latest`.
name: Publish to npm (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Require the tagged commit to be on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Require the tag to match package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
      - run: npm ci
      - name: Require paseo-kit
        run: test -x node_modules/.bin/paseo-kit || { echo "::error::Add paseo-plugin-kit to devDependencies; this workflow runs its paseo-kit bin."; exit 1; }
      # A stable or rc tag needs curated notes (release-notes/<version>.md) before anything is published.
      - name: Require curated release notes
        run: node_modules/.bin/paseo-kit release-notes --check "$RELEASE_TAG"
      - name: Choose the npm dist-tag
        id: dist
        run: |
          tag="$(node_modules/.bin/paseo-kit dist-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing to the npm dist-tag: $tag"
      - name: Verify npm trusted publishing authorization
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { name } = JSON.parse(readFileSync("package.json", "utf8"));
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set("audience", "npm:registry.npmjs.org");
          const identity = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, signal: AbortSignal.timeout(30000) });
          if (!identity.ok) throw new Error(`GitHub OIDC request failed (${identity.status}).`);
          const { value: idToken } = await identity.json();
          console.log(`::add-mask::${idToken}`);
          const claims = JSON.parse(Buffer.from(idToken.split(".")[1], "base64url"));
          console.log(JSON.stringify({ package: name, repository: claims.repository, workflow: claims.workflow_ref, job_workflow: claims.job_workflow_ref, subject: claims.sub, environment: claims.environment, event: claims.event_name }));
          const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, { method: "POST", headers: { Authorization: `Bearer ${idToken}` }, signal: AbortSignal.timeout(30000) });
          const body = await response.json();
          if (!response.ok) {
            console.error(`::error::npm rejected trusted publishing for ${name} (${response.status}): ${body.message || "authorization denied"}. npm checks the caller workflow's filename (workflow_ref above), so the plugin's trusted publisher must name its own publish-npm.yml.`);
            process.exit(1);
          }
          if (!body.token) throw new Error("npm exchange returned no publication token.");
          console.log(`::add-mask::${body.token}`);
          console.log(`npm trusted publishing authorization verified for ${name}.`);
          JS
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Publish or verify the existing package
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const spec = `${pkg.name}@${pkg.version}`;
          const distTag = process.env.DIST_TAG;
          if (distTag !== "beta" && distTag !== "latest") { console.error(`::error::No dist-tag chosen (${distTag}).`); process.exit(1); }
          const run = args => spawnSync("npm", args, { encoding: "utf8" });
          const packed = run(["pack", "--dry-run", "--json"]);
          if (packed.status !== 0) { process.stderr.write(packed.stderr); process.exit(1); }
          const integrity = JSON.parse(packed.stdout)[0].integrity;
          const existing = run(["view", spec, "dist.integrity", "--json", "--prefer-online", "--registry", "https://registry.npmjs.org"]);
          if (existing.status === 0) {
            if (JSON.parse(existing.stdout) !== integrity) {
              console.error(`::error::${spec} already exists with different contents. Release a new version; do not rewrite the tag.`);
              process.exit(1);
            }
            console.log(`${spec} is already published with matching contents; continuing the release.`);
          } else {
            let error;
            try { error = JSON.parse(existing.stdout).error; } catch {}
            if (error?.code !== "E404") { process.stderr.write(existing.stderr); process.exit(1); }
            const result = spawnSync("npm", ["publish", "--access", "public", "--tag", distTag, "--registry", "https://registry.npmjs.org"], { stdio: "inherit" });
            if (result.status !== 0) {
              console.error("::error::npm publication failed. Check this package's GitHub trusted publisher repository, workflow filename, permissions, and environment in npm Settings.");
              process.exit(result.status || 1);
            }
            let verified = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              const remote = run(["view", spec, "dist.integrity", "--json", "--prefer-online", "--registry", "https://registry.npmjs.org"]);
              if (remote.status === 0 && JSON.parse(remote.stdout) === integrity) { verified = true; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!verified) { console.error(`::error::Registry verification failed for ${spec}.`); process.exit(1); }
          }
          JS
      # Runs on the retry path too: the dist-tag must point here and a prerelease must never be latest.
      - name: Verify the npm dist-tags
        run: node_modules/.bin/paseo-kit check-dist-tag

  # The GitHub release, once npm has the package. A release someone already created by hand gets
  # the same body, so none drifts from the format.
  release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Create or update the release with its notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node_modules/.bin/paseo-kit release-notes "$RELEASE_TAG" > "$notes"
          title="$(node -p "require('./package.json').name") $RELEASE_TAG"
          # A version with a prerelease part is a GitHub prerelease and never "Latest".
          case "$RELEASE_TAG" in
            *-*) channel=(--prerelease --latest=false) ;;
            *) channel=(--latest) ;;
          esac
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes" "${channel[@]}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file "$notes" "${channel[@]}"
          fi
